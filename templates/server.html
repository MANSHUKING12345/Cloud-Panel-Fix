<!DOCTYPE html>
<html>
<head>
<title>Cloud Panel - Console</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<style>
body {
    background: linear-gradient(135deg,#020617,#0f172a);
    color: white;
    font-family: Arial;
}

.topbar {
    padding: 15px;
    font-size: 22px;
    font-weight: bold;
}

.tabs {
    display: flex;
    gap: 20px;
    padding: 10px;
}

.tab {
    padding: 10px 20px;
    background: #1e293b;
    border-radius: 8px;
    cursor: pointer;
}

.active {
    background: #0ea5e9;
}

.stats {
    display: flex;
    gap: 20px;
    padding: 15px;
}

.box {
    background: #1e293b;
    padding: 10px 20px;
    border-radius: 10px;
}

.console {
    margin: 20px;
    padding: 15px;
    background: black;
    height: 300px;
    overflow-y: auto;
    border-radius: 10px;
    font-family: monospace;
}

.input-box {
    display: flex;
    margin: 20px;
}

input {
    flex: 1;
    padding: 10px;
    background: #1e293b;
    border: none;
    color: white;
}

button {
    padding: 10px 20px;
    background: #0ea5e9;
    border: none;
    color: white;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 20px;
}

.btn {
    padding: 15px 40px;
    border-radius: 10px;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

.start { background: green; }
.stop { background: red; }
.restart { background: orange; }
</style>

</head>

<body>

<div class="topbar">☁️ CLOUD PANEL</div>

<div class="tabs">
<div class="tab active">Console</div>
<div class="tab">Files</div>
<div class="tab">Plugins</div>
<div class="tab">Mods & Worlds</div>
<div class="tab">Players</div>
</div>

<div class="stats">
<div class="box">IP: 192.168.1.100:25565</div>
<div class="box">CPU: 35%</div>
<div class="box">RAM: 2048 / 4096 MB</div>
<div class="box">Disk: 160 / 500 GB</div>
</div>

<div class="console">
[INFO] Server started successfully!<br>
[INFO] Loading world...<br>
[INFO] Essentials enabled<br>
[WARNING] Low memory detected<br>
</div>

<div class="input-box">
<input placeholder="Type your command...">
<button>Send</button>
</div>

<div class="controls">
<div class="btn start">Start</div>
<div class="btn stop">Stop</div>
<div class="btn restart">Restart</div>
</div>

</body>
</html>
