<!DOCTYPE html>
<html>
<head>
<title>Server Console</title>

<style>
body {
    margin: 0;
    font-family: monospace;
    background: #0f172a;
    color: white;
}

/* Layout */
.container {
    display: flex;
    height: 100vh;
}

/* Sidebar */
.sidebar {
    width: 220px;
    background: #020617;
    padding: 20px;
}

.sidebar a {
    display: block;
    color: #cbd5f5;
    padding: 10px;
    text-decoration: none;
}

.sidebar a:hover {
    background: #1e293b;
}

/* Main */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* Topbar */
.topbar {
    background: #1e293b;
    padding: 10px;
}

/* Console */
.console {
    flex: 1;
    background: black;
    padding: 15px;
    overflow-y: auto;
    font-size: 14px;
}

/* Input */
.input-box {
    display: flex;
    background: #020617;
    padding: 10px;
}

.input-box input {
    flex: 1;
    padding: 10px;
    border: none;
    background: black;
    color: lime;
}

.input-box button {
    padding: 10px;
    background: #6366f1;
    border: none;
    color: white;
}
</style>

</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
        <h3>☁️ Cloud</h3>
        <a href="/index">Dashboard</a>
        <a href="/admin">Admin</a>
        <a href="/logout">Logout</a>
    </div>

    <!-- Main -->
    <div class="main">

        <div class="topbar">
            <h3>Server Console - {{ server_id }}</h3>
        </div>

        <!-- Console Output -->
        <div class="console" id="console">
            <p>Server starting...</p>
            <p>Loading resources...</p>
            <p style="color:lime;">Server Online ✔</p>
        </div>

        <!-- Input -->
        <div class="input-box">
            <input id="cmd" placeholder="Enter command...">
            <button onclick="sendCommand()">Send</button>
        </div>

    </div>

</div>

<script>
function sendCommand() {
    let input = document.getElementById("cmd");
    let consoleBox = document.getElementById("console");

    let cmd = input.value;

    if(cmd.trim() === "") return;

    let line = document.createElement("p");
    line.style.color = "cyan";
    line.innerText = "> " + cmd;

    consoleBox.appendChild(line);

    input.value = "";
    consoleBox.scrollTop = consoleBox.scrollHeight;
}
</script>

</body>
</html>
