<!DOCTYPE html>
<html>
<head>
<title>Register</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg,#020617,#0f172a);
    font-family: Arial;
    color: white;
}

.box {
    background: #0f172a;
    padding: 40px;
    border-radius: 15px;
    width: 320px;
    box-shadow: 0 0 30px rgba(0,0,0,0.6);
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    background: #1e293b;
    border: none;
    color: white;
    border-radius: 8px;
}

button {
    width: 100%;
    padding: 12px;
    background: #22c55e;
    border: none;
    border-radius: 8px;
    color: white;
}

a {
    color: #38bdf8;
    text-decoration: none;
    display: block;
    text-align: center;
    margin-top: 10px;
}
</style>

</head>

<body>

<div class="box">
    <h2>Create Account</h2>

    <form method="POST">
        <input type="text" name="username" placeholder="Username">
        <input type="password" name="password" placeholder="Password">
        <button type="submit">Register</button>
    </form>

    <a href="/login">Back to Login</a>
</div>

</body>
</html>
