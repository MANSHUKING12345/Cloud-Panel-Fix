<!DOCTYPE html>
<html>
<head>
<title>Cloud Panel Login</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg,#020617,#0f172a);
    font-family: Arial;
    color: white;
}

.login-box {
    background: #0f172a;
    padding: 40px;
    border-radius: 15px;
    width: 320px;
    box-shadow: 0 0 30px rgba(0,0,0,0.6);
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    background: #1e293b;
    border: none;
    color: white;
    border-radius: 8px;
}

button {
    width: 100%;
    padding: 12px;
    background: #0ea5e9;
    border: none;
    border-radius: 8px;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #0284c7;
}

a {
    color: #38bdf8;
    text-decoration: none;
    display: block;
    text-align: center;
    margin-top: 10px;
}
</style>

</head>

<body>

<div class="login-box">
    <h2>☁️ Cloud Panel</h2>

    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
    </form>

    <a href="/register">Create Account</a>
</div>

</body>
</html>
